<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Backstab Arena - Assassin Edition</title>
    <script src="/socket.io/socket.io.js"></scㅁript>
    <style>
        body { margin: 0; background-color: #1a1a1a; color: white; font-family: 'Arial', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #login-screen { background: rgba(0, 0, 0, 0.8); padding: 30px; border-radius: 15px; border: 2px solid #c0392b; text-align: center; }
        input { padding: 10px; margin: 5px; border-radius: 5px; border: none; width: 200px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
        .btn-login { background-color: #c0392b; color: white; }
        .btn-signup { background-color: #7f8c8d; color: white; }
        canvas { background-color: #2c3e50; border: 5px solid #34495e; display: none; }
        #ui { position: absolute; top: 20px; left: 20px; display: none; pointer-events: none; }
        .stat-box { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; font-size: 18px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>BACKSTAB ARENA</h1>
        <p>암살자의 전장에 오신 것을 환영합니다.</p>
        <input type="text" id="username" placeholder="아이디"><br>
        <input type="password" id="password" placeholder="비밀번호"><br>
        <button class="btn-login" onclick="login()">로그인</button>
        <button class="btn-signup" onclick="signup()">새 계정 생성하기</button>
    </div>

    <div id="ui">
        <div class="stat-box">
            👤 <span id="display-name">---</span> | 💰 GOLD: <span id="display-gold">0</span>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const loginScreen = document.getElementById('login-screen');
        const ui = document.getElementById('ui');

        let myData = null;
        let players = {};

        // 1. 회원가입 및 로그인 로직
        function signup() {
            const id = document.getElementById('username').value;
            const pw = document.getElementById('password').value;
            // 초기 재화를 0으로 설정하여 서버에 전송
            socket.emit('signup', { id, pw, initialData: { gold: 0, wins: 0 } });
        }

        function login() {
            const id = document.getElementById('username').value;
            const pw = document.getElementById('password').value;
            socket.emit('login', { id, pw });
        }

        socket.on('loginSuccess', (data) => {
            myData = data;
            loginScreen.style.display = 'none';
            canvas.style.display = 'block';
            ui.style.display = 'block';
            document.getElementById('display-name').innerText = myData.id;
            document.getElementById('display-gold').innerText = myData.gold || 0;
            gameLoop();
        });

        socket.on('error', (msg) => alert(msg));

        // 2. 캐릭터 모델링 그리기 함수 (암살자 스타일)
        function drawPlayer(x, y, name, isMe) {
            ctx.save();
            ctx.translate(x, y);

            // [몸통 - 어두운 암살자 망토]
            ctx.fillStyle = isMe ? '#2980b9' : '#c0392b'; 
            ctx.fillRect(-15, -15, 30, 30); 

            // [머리]
            ctx.beginPath();
            ctx.arc(0, -15, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#f1c27d'; 
            ctx.fill();
            ctx.closePath();

            // [눈매 - 닌자 복면 띠]
            ctx.fillStyle = '#333';
            ctx.fillRect(-12, -20, 24, 6);
            ctx.fillStyle = 'red'; // 매서운 눈
            ctx.fillRect(-6, -18, 2, 2);
            ctx.fillRect(4, -18, 2, 2);

            // [무기 - 은빛 단검]
            ctx.fillStyle = '#bdc3c7'; // 칼날
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(35, 0);
            ctx.lineTo(15, 8);
            ctx.fill();
            ctx.fillStyle = '#7f8c8d'; // 칼자루
            ctx.fillRect(10, -2, 6, 12);

            // 이름 표시
            ctx.fillStyle = "white";
            ctx.font = "12px Arial";
            ctx.textAlign = "center";
            ctx.fillText(name, 0, -35);

            ctx.restore();
        }

        // 3. 게임 루프
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 여기에 플레이어 이동 및 소켓 업데이트 로직 추가 가능
            // 임시로 내 캐릭터 그리기
            drawPlayer(canvas.width/2, canvas.height/2, myData.id, true);

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
